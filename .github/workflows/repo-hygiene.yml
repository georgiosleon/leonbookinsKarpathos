name: Repo hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Artifact and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check for tracked forbidden artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='\.(db|db-journal|db-shm|db-wal|sqlite3|sqlite3\.enc|jar)$|^backups/|^target/|^install/dist/|^\.env$'
          matches="$(git ls-files | grep -E "$forbidden_pattern" | grep -Ev '^\.mvn/wrapper/maven-wrapper\.jar$' || true)"
          if [[ -n "$matches" ]]; then
            echo "::error::Forbidden tracked files detected:"
            echo "$matches"
            exit 1
          fi
          echo "No forbidden tracked artifacts found."

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

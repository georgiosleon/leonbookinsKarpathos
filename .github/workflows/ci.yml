name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify backend and Maven frontend build
        run: ./mvnw -B verify

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check translations
        run: node scripts/check-translations.js

      - name: Docs/help smoke check
        run: node scripts/check-docs-smoke.js

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  quality:
    name: Quality (Checkstyle/PMD/SpotBugs/JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify with quality profile
        run: ./mvnw -B -Pquality verify

  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build app
        run: ./mvnw -B -DskipTests package

      - name: Install frontend deps and Playwright browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start app
        run: |
          java -jar target/leonbookinsKarpathos-*.jar > target/app-e2e.log 2>&1 &
          echo $! > target/app-e2e.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/login >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "App failed to start"; cat target/app-e2e.log; exit 1
        env:
          APP_ADMIN_USERNAME: admin
          APP_ADMIN_PASSWORD: 1qaz2wsx3edc
          APP_OPERATOR_USERNAME: user
          APP_OPERATOR_PASSWORD: 1qaz2wsx3edc
          APP_GUEST_USERNAME: guest
          APP_GUEST_PASSWORD: 1qaz2wsx3edc
          APP_DB_URL: jdbc:sqlite:${{ github.workspace }}/target/e2e.db

      - name: Run Playwright smoke
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test

      - name: Stop app
        if: always()
        run: |
          if [ -f target/app-e2e.pid ]; then kill $(cat target/app-e2e.pid) || true; fi


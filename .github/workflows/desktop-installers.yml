name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: liberica
          java-version: "25"
      - name: Check tag matches Maven project version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          project_version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "::error::Release tag v${tag_version} does not match pom.xml version ${project_version}."
            exit 1
          fi

  build:
    name: Build ${{ matrix.package }}
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: deb
          - os: ubuntu-latest
            package: linux
          - os: macos-latest
            package: dmg
          - os: macos-latest
            package: portable
          - os: windows-latest
            package: msi
          - os: windows-latest
            package: portable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: liberica
          java-version: "25"
          cache: maven
      - name: Build Linux or macOS installer
        if: runner.os != 'Windows'
        run: bash install/package.sh ${{ matrix.package }}
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install\package.ps1 ${{ matrix.package }}
      - name: Smoke test bundled Linux runtime
        if: matrix.package == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          app_dir="$RUNNER_TEMP/leon-bookings-runtime-smoke"
          mkdir -p "$app_dir"
          tar -xzf "install/dist/linux/LeonBookings-${version}-linux-$(uname -m).tar.gz" -C "$app_dir"
          java="$app_dir/LeonBookings/lib/runtime/bin/java"
          app="$app_dir/LeonBookings/lib/app/leonbookinsKarpathos.jar"
          test -x "$java"

          APP_ADMIN_USERNAME=runtime-smoke \
          APP_ADMIN_PASSWORD=runtime-smoke-password \
          APP_DB_URL="jdbc:sqlite:$RUNNER_TEMP/leon-bookings-runtime-smoke.db" \
          SERVER_PORT=18080 \
            "$java" -jar "$app" >"$RUNNER_TEMP/leon-bookings-runtime-smoke.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/login >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/leon-bookings-runtime-smoke.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/leon-bookings-runtime-smoke.log"
          echo "Bundled runtime did not start the application." >&2
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leon-bookings-${{ matrix.package }}-${{ runner.os }}
          path: install/dist/${{ matrix.package }}/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: leon-bookings-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Leon Bookings ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*

server.address=${SERVER_ADDRESS:127.0.0.1}
logging.level.com.leonsoft=INFO
server.error.include-stacktrace=never
# Actuator is bundled; health and info are exposed and restricted to ADMIN by SecurityConfig.
# Do not broaden the exposure list without reviewing SecurityConfig and deployment needs.
# Schema is managed by Flyway migrations; Hibernate validates mappings on startup.
spring.jpa.hibernate.ddl-auto=validate
spring.web.resources.cache.period=0s

# Production: license must be explicitly activated with a configured production key.
# No fallback to the embedded development key is allowed in this profile.
app.license.bypass=false
app.license.public-key=${APP_LICENSE_PUBLIC_KEY}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

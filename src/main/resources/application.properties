##############################
#  PROPERTIES SPRING - BOOT
##############################
debug=false

spring.profiles.active=dev

server.port=8080

#server.servlet.context-path=/leon
spa.default-file=classpath:/public/index.html

logging.level.root=INFO

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.jpa.open-in-view=false

booking.availability.rooms.prevent-overlap=${BOOKING_AVAILABILITY_ROOMS_PREVENT_OVERLAP:true}
booking.availability.cars.prevent-overlap=${BOOKING_AVAILABILITY_CARS_PREVENT_OVERLAP:true}
app.deployment-type=${APP_DEPLOYMENT_TYPE:standalone}
app.diagnostics.log-file=${APP_DIAGNOSTICS_LOG_FILE:}

# Serve packaged frontend and static assets from the classpath.
spring.web.resources.static-locations=classpath:/public/

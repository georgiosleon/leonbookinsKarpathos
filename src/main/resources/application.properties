##############################
#  PROPERTIES SPRING - BOOT
##############################
debug=false

spring.profiles.active=dev

server.port=8080

#server.servlet.context-path=/leon
spa.default-file=classpath:/public/index.html
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}

logging.level.root=INFO

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.sql.init.mode=always
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.jpa.open-in-view=false

# Serve packaged frontend and static assets from the classpath.
spring.web.resources.static-locations=classpath:/public/

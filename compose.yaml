services:
  app:
    build: .
    image: leonbookinskarpathos:local
    restart: unless-stopped
    ports:
      - "${BOOKING_HOST_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:?Set APP_ADMIN_USERNAME in .env}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
      APP_OPERATOR_USERNAME: ${APP_OPERATOR_USERNAME:?Set APP_OPERATOR_USERNAME in .env}
      APP_OPERATOR_PASSWORD: ${APP_OPERATOR_PASSWORD:?Set APP_OPERATOR_PASSWORD in .env}
      APP_GUEST_USERNAME: ${APP_GUEST_USERNAME:?Set APP_GUEST_USERNAME in .env}
      APP_GUEST_PASSWORD: ${APP_GUEST_PASSWORD:?Set APP_GUEST_PASSWORD in .env}
      APP_DB_URL: jdbc:sqlite:/data/bookings.db
      APP_DEPLOYMENT_TYPE: docker
      APP_DIAGNOSTICS_LOG_FILE: /data/application.log
      LOGGING_FILE_NAME: /data/application.log
      APP_LICENSE_PUBLIC_KEY: ${APP_LICENSE_PUBLIC_KEY:?Set APP_LICENSE_PUBLIC_KEY in .env}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
    volumes:
      - booking-data:/data

volumes:
  booking-data:
